obstacle_type: broad
sampling_steps: 256
time_discretization: uniform
time_discretization_kwargs:
  prior_time_offset: 0.001
sampler_interpolation_coeff: 1.0
env_objective: []
env_constraints:
  - dynamics
  - ellipses
proxy_objective_value_weight: 2.0
proxy_constraint_penalty_weight: 0.1
constraint_margin: 0.4
policy_kwargs:
  cbf_coefficient: 256.0
  guidance_start_fraction: 0.5
  allow_qp: true
  sigmoid_bias_fraction: 0.98
  sigmoid_input_scale: 256.0
  sigmoid_output_scale: 1.0

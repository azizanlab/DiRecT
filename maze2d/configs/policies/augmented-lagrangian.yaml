obstacle_type: broad
sampling_steps: 256
time_discretization: uniform
time_discretization_kwargs:
  prior_time_offset: 0.001
sampler_interpolation_coeff: 1.0
env_objective: []
env_constraints:
  - dynamics
  - ellipses
proxy_objective_value_weight: 2.0
proxy_constraint_penalty_weight: 0.1
constraint_margin: 0.4
policy_kwargs:
  use_cbfs: false                   # Enable discrete-time CBFs across planning horizon
  cbf_alpha: 0.9
  relaxation_steps_at_source: 0
  relaxation_steps_at_target: 200     # Original impl. has extra 200 steps at the end that "do a lot of work"
  # Values adapted from discrete to continuous time formulation with time convention reversal [0 -> 1]
  learning_rate: 0.45                 
  initial_penalty: 0.025
  final_penalty: 0.154
  guidance_start_fraction: 0.5

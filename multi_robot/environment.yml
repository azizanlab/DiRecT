name: direct-mmd
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - patchelf
  - pip:
      # Change the torch, jax to match cuda version
      # Index URLs for PyTorch CUDA and JAX CUDA wheels
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - --find-links https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
      - torch==2.4.0
      - torchvision==0.19.0
      - torchdiffeq
      - torch-summary
      - jax==0.4.13
      - jaxlib==0.4.13+cuda12.cudnn89
      - jaxopt==0.8.5
      - pyyaml
      - setuptools==70.2.0
      - ml-collections==0.1.1
      - configargparse
      - hydra==2.5
      - numpy==1.24.4
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - scikit-image==0.19.3
      - pandas==2.0.3
      - matplotlib==3.7.5
      - plotly
      - seaborn==0.13.2
      - opencv-python==4.10.0.84
      - pillow
      - einops==0.6.1
      - tensorboard==2.14.0
      - wandb
      - sentence-transformers
      - transformers==4.46.3
      - casadi
      - trimesh
      - pyrender==0.1.45
      - urdfpy==0.0.22
      - urdf-parser-py
      - pycollada
      - mesh-to-sdf
      - shapely
      - pygame
      - cholespy==2.0.0
      - gdown
      - tqdm==4.43.0
      - networkx
      - moviepy
      - tabulate
      - gitpython
      - scikit-video
      - joblib
